name: Verify BREAK TIME
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:all
