services:
  - type: web
    name: break-time
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    region: oregon
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    startCommand: node build/server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
